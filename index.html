<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>優勢觀點測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2D7A4F;
    --green-light: #E8F5EE;
    --amber: #E8971A;
    --amber-light: #FEF3DC;
    --red: #D94040;
    --red-light: #FDEAEA;
    --gray: #6B7280;
    --gray-light: #F0F0EE;
    --text: #1A1A1A;
    --border: #E5E7EB;
    --white: #FFFFFF;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #F7F8F5;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 56px;
  }

  /* ── 開始畫面 ── */
  .start-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }
  .start-logo {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto 20px;
  }
  .start-tag {
    display: inline-block;
    background: var(--green-light);
    color: var(--green);
    font-size: 13px;
    font-weight: 500;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .start-title { font-size: 26px; font-weight: 700; line-height: 1.35; margin-bottom: 10px; }
  .start-desc { font-size: 16px; color: var(--gray); line-height: 1.75; margin-bottom: 32px; }
  .mode-cards { width: 100%; display: flex; flex-direction: column; gap: 12px; max-width: 400px; }
  .mode-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    font-family: inherit;
    width: 100%;
  }
  .mode-card:active { transform: scale(0.98); }
  .mode-card.pre { border-color: var(--amber); }
  .mode-card.post { border-color: var(--green); }
  .mode-icon { font-size: 24px; margin-bottom: 8px; }
  .mode-label {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .mode-card.pre .mode-label { color: #8A5A00; }
  .mode-card.post .mode-label { color: var(--green); }
  .mode-hint { font-size: 14px; color: var(--gray); line-height: 1.6; }

  /* ── Header ── */
  .header {
    background: var(--green);
    color: white;
    padding: 18px 20px 28px;
    position: relative;
    overflow: hidden;
  }
  .header.pre-mode { background: #A06A00; }
  .header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 20px;
    background: #F7F8F5;
    border-radius: 20px 20px 0 0;
  }
  .header-tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 12px;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .header h1 { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .header p { font-size: 14px; opacity: 0.85; margin-top: 6px; }

  /* ── Progress ── */
  .progress-wrap { padding: 16px 20px 8px; }
  .progress-bar-bg {
    background: var(--border);
    border-radius: 99px;
    height: 7px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-bar-fill {
    background: var(--green);
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .pre-mode-active .progress-bar-fill { background: var(--amber); }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--gray);
  }
  .dot-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
  .dot.done { background: var(--green); }
  .dot.done-pre { background: var(--amber); }
  .dot.current { background: var(--amber); }
  .dot.current-post { background: var(--green); }

  /* ── Question card ── */
  .q-wrap { padding: 8px 16px; }
  .q-card {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 2px 14px rgba(0,0,0,0.07);
  }
  .q-top {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .q-badge {
    display: inline-block;
    background: var(--green-light);
    color: var(--green);
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .pre-mode-active .q-badge { background: var(--amber-light); color: #7A4800; }
  .q-text {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.8;
    color: var(--text);
  }
  .q-opts { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    width: 100%;
    text-align: left;
    padding: 16px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--white);
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    line-height: 1.6;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .opt-btn:active { transform: scale(0.98); }
  .opt-letter {
    display: inline-flex;
    min-width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--gray-light);
    color: var(--gray);
    font-size: 13px;
    font-weight: 700;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .opt-btn.selected { border-color: var(--amber); background: var(--amber-light); }
  .opt-btn.selected .opt-letter { background: var(--amber); color: white; }
  .opt-btn.correct { border-color: var(--green); background: var(--green-light); }
  .opt-btn.correct .opt-letter { background: var(--green); color: white; }
  .opt-btn.wrong { border-color: var(--red); background: var(--red-light); }
  .opt-btn.wrong .opt-letter { background: var(--red); color: white; }
  .opt-btn.disabled { pointer-events: none; opacity: 0.6; }
  .opt-btn.correct.disabled, .opt-btn.wrong.disabled, .opt-btn.selected.disabled { opacity: 1; }

  /* ── Explain ── */
  .explain-box {
    margin: 0 16px 16px;
    background: var(--green-light);
    border-left: 3px solid var(--green);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    color: #1A4A30;
    line-height: 1.8;
    display: none;
  }
  .explain-box.show { display: block; }
  .explain-label { font-weight: 700; margin-bottom: 6px; font-size: 12px; letter-spacing: 0.5px; color: var(--green); }

  /* ── Nav ── */
  .nav-wrap { padding: 14px 16px; display: flex; gap: 10px; }
  .nav-btn {
    flex: 1;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn:active { transform: scale(0.97); }
  .nav-prev { background: var(--white); border: 1.5px solid var(--border); color: var(--gray); }
  .nav-next { background: var(--green); color: white; }
  .pre-mode-active .nav-next { background: var(--amber); }

  /* ── Score ── */
  .score-screen { display: none; padding: 20px 16px; }
  .score-screen.show { display: block; }
  .score-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    margin-bottom: 16px;
  }
  .score-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--green-light);
    border: 4px solid var(--green);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    flex-direction: column;
  }
  .score-circle.pre { background: var(--amber-light); border-color: var(--amber); }
  .score-num { font-size: 40px; font-weight: 700; color: var(--green); line-height: 1; }
  .score-circle.pre .score-num { color: #8A5A00; }
  .score-denom { font-size: 15px; color: var(--gray); margin-top: 2px; }
  .score-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .score-desc { font-size: 15px; color: var(--gray); line-height: 1.8; }
  .pre-note {
    background: var(--amber-light);
    border: 1.5px solid var(--amber);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 15px;
    color: #7A4800;
    line-height: 1.75;
    margin-bottom: 16px;
    text-align: center;
  }
  .pre-note strong { font-size: 22px; display: block; margin-bottom: 4px; }
  .section-label { font-size: 13px; font-weight: 700; color: var(--gray); margin: 16px 0 8px; letter-spacing: 0.5px; }
  .review-list { display: flex; flex-direction: column; gap: 10px; }
  .review-item {
    background: var(--white);
    border-radius: 10px;
    padding: 14px 16px;
    border-left: 4px solid var(--border);
    box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  }
  .review-item.ok { border-color: var(--green); }
  .review-item.fail { border-color: var(--red); }
  .review-num { font-size: 12px; color: var(--gray); margin-bottom: 4px; }
  .review-q { font-size: 14px; font-weight: 500; line-height: 1.55; margin-bottom: 6px; }
  .review-tag { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .review-tag.ok { background: var(--green-light); color: var(--green); }
  .review-tag.fail { background: var(--red-light); color: var(--red); }

  .action-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn-green { background: var(--green); color: white; }
  .btn-outline { background: var(--white); border: 1.5px solid var(--border); color: var(--gray); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ── 開始畫面 ── -->
<div id="start-screen" class="start-screen">
  <div class="start-logo">🌱</div>
  <div class="start-tag">新北市社區培力育成中心</div>
  <h1 class="start-title">你有沒有<br>優勢觀點？</h1>
  <p class="start-desc">共 10 題情境選擇題<br>選出你認為最合適的做法</p>
  <div class="mode-cards">
    <button class="mode-card pre" onclick="startQuiz('pre')">
      <div class="mode-icon">📝</div>
      <div class="mode-label">上課前測驗</div>
      <div class="mode-hint">作答完只看分數，不顯示對錯<br>請記下你的分數，上課後再來比較！</div>
    </button>
    <button class="mode-card post" onclick="startQuiz('post')">
      <div class="mode-icon">✅</div>
      <div class="mode-label">上課後測驗</div>
      <div class="mode-hint">每題作答後立即顯示對錯與說明<br>看看你的思維有沒有改變</div>
    </button>
  </div>
</div>

<!-- ── 測驗畫面 ── -->
<div id="quiz-screen" class="hidden">
  <div class="header" id="quiz-header">
    <div class="header-tag" id="mode-tag"></div>
    <h1>你有沒有優勢觀點？</h1>
    <p id="header-sub"></p>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="prog-fill"></div>
    </div>
    <div class="progress-meta">
      <span id="prog-label"></span>
      <div class="dot-row" id="dot-row"></div>
    </div>
  </div>

  <div class="q-wrap">
    <div class="q-card">
      <div class="q-top">
        <div class="q-badge" id="q-badge"></div>
        <div class="q-text" id="q-text"></div>
      </div>
      <div class="q-opts" id="q-opts"></div>
      <div class="explain-box" id="explain-box">
        <div class="explain-label">優勢觀點怎麼說？</div>
        <div id="explain-text"></div>
      </div>
    </div>
  </div>

  <div class="nav-wrap">
    <button class="nav-btn nav-prev" onclick="goQ(-1)">← 上一題</button>
    <button class="nav-btn nav-next" id="next-btn" onclick="goQ(1)">下一題 →</button>
  </div>
</div>

<!-- ── 成績畫面 ── -->
<div id="score-screen" class="score-screen">
  <!-- 前測專用提示 -->
  <div class="pre-note hidden" id="pre-note">
    <strong id="pre-score-big"></strong>
    請把這個分數記下來 📝<br>上課結束後再來測一次，看看你的思維改變了多少！
  </div>
  <!-- 後測成績卡 -->
  <div class="score-card" id="score-card">
    <div class="score-circle" id="score-circle">
      <span class="score-num" id="final-score">0</span>
      <span class="score-denom">/10</span>
    </div>
    <div class="score-title" id="score-title"></div>
    <div class="score-desc" id="score-desc"></div>
  </div>
  <!-- 後測逐題回顧 -->
  <div id="review-wrap" class="hidden">
    <div class="section-label">逐題回顧</div>
    <div class="review-list" id="review-list"></div>
  </div>

  <button class="action-btn btn-green" onclick="goHome()">回到首頁，再測一次</button>
</div>

<script>
const questions = [
  {
    badge: "社區發展方向",
    q: "理事長說：「我們社區問題一堆，要先把問題解決完才能談發展。」你怎麼看？",
    opts: [
      "對，問題不解決，發展只是空談",
      "先盤點社區有什麼資源，從優勢出發同時回應問題",
      "直接跳過問題，專注正在推動的發展就好"
    ],
    ans: 1,
    explain: "優勢觀點不是要逃避問題，而是不讓問題成為唯一的出發點。社區的能量與資源是發展的基礎，從這裡出發，問題自然也能被一起回應。"
  },
  {
    badge: "少數人的力量",
    q: "社區辦活動只來了三個志工，幹部說「這樣不夠，根本辦不起來」。你的看法？",
    opts: [
      "同意，人太少活動品質一定差",
      "先取消，等招募足夠的人夠再辦理",
      "三個願意投入的人就是起點，設計適簡單不用太多人力的活動"
    ],
    ans: 2,
    explain: "即使資源少，有人願意投入就是一種力量。優勢觀點鼓勵我們從現有的能量出發，而不是用「缺乏」來定義自己。"
  },
  {
    badge: "沒有經費怎麼辦",
    q: "社區想辦長者共餐，但帳戶裡沒有太多錢。你會怎麼做？",
    opts: [
      "放棄，沒錢什麼都做不了",
      "等下次有補助再說",
      "先辦理一場零成本的聚會，盤點社區有的空間、人脈與食材來運用"
    ],
    ans: 2,
    explain: "資源不只是錢，人、空間、時間、技能、關係都是資本。優勢觀點幫助我們看見手邊現有的，而不是被「沒有錢」這個框架困住。"
  },
  {
    badge: "參與人數與凝聚力",
    q: "理事長嘆氣：「每次活動就那幾個人，代表大家根本不在乎社區。」你怎麼回應？",
    opts: [
      "同意，參與人少就是凝聚力差的證明",
      "那幾個常來的人正是社區核心，先從他們出發，設計更容易吸引人加入的活動",
      "辦更多活動讓大家沒藉口不來"
    ],
    ans: 1,
    explain: "人手不足不代表凝聚力薄弱。願意固定來的人就是社區的核心能量，從他們出發，慢慢降低加入門檻，才能帶動更多人。"
  },
  {
    badge: "多元參與方式",
    q: "隔壁阿姨從不參加社區活動，但你發現她每天默默幫忙澆公共花圃的花。這位阿姨是？",
    opts: [
      "不算社區參與，來活動才算",
      "用她自己的方式貢獻，是值得被看見的社區力量",
      "跟活動沒關係，不用在意"
    ],
    ans: 1,
    explain: "參與社區的方式很多，不是只有來活動才算。默默澆花的阿姨，用她的方式在關心社區，這正是優勢觀點要我們去看見的。"
  },
  {
    badge: "空間資源再定義",
    q: "社區裡有一個多年閒置的倉庫，大家都覺得是麻煩。用優勢觀點，你怎麼看？",
    opts: [
      "趕快請公部門拆掉",
      "申請補助整修後交回公部門管理",
      "這是社區可以自主活化的空間資產，居民一起討論可以變成什麼"
    ],
    ans: 2,
    explain: "閒置空間不是負擔，而是還沒被使用或運用的資產。倉庫可以變成共學空間、共餐場地、共享書屋……由居民共同定義，才是在地發展的精神。"
  },
  {
    badge: "社區自主定義",
    q: "社會局建議社區今年以「高齡友善」為主題發展。理事長說「好，那我們就照這個方向做」。這樣的態度符合優勢觀點嗎？",
    opts: [
      "符合，配合政府方向才能拿到資源",
      "不一定，應先問居民社區真正需要什麼",
      "無所謂，方向都一樣"
    ],
    ans: 1,
    explain: "社區的發展方向應由居民共同定義，而不是直接承接政府設定好的目標。優勢觀點強調居民的主體性，我們的願景是自己的，不是政府要我們完成的專案。"
  },
  {
    badge: "年輕人與社區",
    q: "社區活動年輕人幾乎都不來，幹部說「他們對社區根本沒興趣」。你的觀點詮釋是？",
    opts: [
      "同意，年輕人本來就不關心社區",
      "辦網紅活動吸引他們",
      "先了解年輕人用什麼方式在意社區，也許他們正在用不同的管道認識或幫助社區"
    ],
    ans: 2,
    explain: "不參加活動不等於不關心社區。也許他們在線上分享社區資訊、默默幫助鄰居。優勢觀點幫我們看見不同形式的參與，而不是用單一標準評斷。"
  },
  {
    badge: "別只靠一個人",
    q: "社區裡有位阿美姐，超熱心什麼都做，大家都靠她。但最近她說身體不好要休息一陣子，社區頓時不知道怎麼辦。這個狀況告訴我們什麼？",
    opts: [
      "阿美姐真的很重要，要趕快說服她繼續撐著",
      "馬上找一個跟阿美姐一樣熱心的人來接替",
      "平時就該讓更多人一起參與，不能只靠一個人，這樣社區才不會因為一個人離開就停擺"
    ],
    ans: 2,
    explain: "熱心的人是社區的寶，但優勢觀點提醒我們要建立集體的能量，而不是依賴單一關鍵人。讓更多人參與、分擔，社區才有持續的韌性。"
  },
  {
    badge: "沒有計畫書怎麼辦",
    q: "幹部說：「我們社區沒人會寫計畫書，所以什麼補助都申請不到。」用優勢觀點，你的回應是？",
    opts: [
      "那就花錢找外面的顧問來寫",
      "放棄補助，社區沒有文書的人力做不了大事",
      "先從不需要計畫書的小行動累積成果，展示社區能量才是最好的申請基礎"
    ],
    ans: 2,
    explain: "不會寫計畫書不代表做不了事。優勢觀點鼓勵我們從現有能力出發，先創造小行動、累積真實成果，有了故事才有更強的申請底氣。"
  }
];

let mode = 'post'; // 'pre' or 'post'
let idx = 0;
let answered = new Array(questions.length).fill(null);
let score = 0;

function startQuiz(m) {
  mode = m;
  idx = 0;
  score = 0;
  answered = new Array(questions.length).fill(null);

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('score-screen').classList.remove('show');
  document.getElementById('quiz-screen').classList.remove('hidden');

  const header = document.getElementById('quiz-header');
  const progressWrap = document.getElementById('progress-wrap');
  const nextBtn = document.getElementById('next-btn');

  if (mode === 'pre') {
    header.classList.add('pre-mode');
    progressWrap.classList.add('pre-mode-active');
    document.getElementById('mode-tag').textContent = '上課前測驗';
    document.getElementById('header-sub').textContent = '共 10 題・作答後只看分數';
    nextBtn.style.background = '#E8971A';
  } else {
    header.classList.remove('pre-mode');
    progressWrap.classList.remove('pre-mode-active');
    document.getElementById('mode-tag').textContent = '上課後測驗';
    document.getElementById('header-sub').textContent = '共 10 題・作答後立即看說明';
    nextBtn.style.background = '';
  }

  initDots();
  render();
}

function initDots() {
  const row = document.getElementById('dot-row');
  row.innerHTML = questions.map((_, i) => `<div class="dot" id="dot${i}"></div>`).join('');
}

function render() {
  const d = questions[idx];
  const isPreMode = mode === 'pre';

  document.getElementById('q-badge').textContent = d.badge;
  document.getElementById('q-text').textContent = d.q;

  // badge color
  const badge = document.getElementById('q-badge');
  badge.style.background = isPreMode ? '#FEF3DC' : '';
  badge.style.color = isPreMode ? '#7A4800' : '';

  const opts = document.getElementById('q-opts');
  opts.innerHTML = d.opts.map((o, i) => {
    let cls = 'opt-btn';
    if (answered[idx] !== null) {
      cls += ' disabled';
      if (!isPreMode) {
        if (i === d.ans) cls += ' correct';
        else if (i === answered[idx] && i !== d.ans) cls += ' wrong';
      } else {
        if (i === answered[idx]) cls += ' selected';
      }
    }
    return `<button class="${cls}" onclick="answer(${i})">
      <span class="opt-letter">${String.fromCharCode(65+i)}</span>
      <span>${o}</span>
    </button>`;
  }).join('');

  const explain = document.getElementById('explain-box');
  document.getElementById('explain-text').textContent = d.explain;
  if (answered[idx] !== null && !isPreMode) explain.classList.add('show');
  else explain.classList.remove('show');

  const pct = ((idx + 1) / questions.length * 100).toFixed(1);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `第 ${idx+1} 題 / 共 ${questions.length} 題`;

  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = idx === questions.length - 1 ? '查看成績 →' : '下一題 →';

  questions.forEach((_, i) => {
    const dot = document.getElementById('dot'+i);
    if (!dot) return;
    if (answered[i] !== null) {
      dot.className = isPreMode ? 'dot done-pre' : 'dot done';
    } else if (i === idx) {
      dot.className = 'dot current';
    } else {
      dot.className = 'dot';
    }
  });
}

function answer(i) {
  if (answered[idx] !== null) return;
  answered[idx] = i;
  if (i === questions[idx].ans) score++;
  render();
}

function goQ(d) {
  if (idx === questions.length - 1 && d === 1) { showScore(); return; }
  idx = Math.max(0, Math.min(questions.length - 1, idx + d));
  render();
}

function showScore() {
  document.getElementById('quiz-screen').classList.add('hidden');
  const ss = document.getElementById('score-screen');
  ss.classList.add('show');
  document.getElementById('final-score').textContent = score;

  const isPreMode = mode === 'pre';
  const preNote = document.getElementById('pre-note');
  const reviewWrap = document.getElementById('review-wrap');
  const scoreCircle = document.getElementById('score-circle');

  if (isPreMode) {
    // 前測：只顯示分數提示，不顯示對錯說明
    preNote.classList.remove('hidden');
    document.getElementById('pre-score-big').textContent = `我的分數：${score} / 10`;
    reviewWrap.classList.add('hidden');
    scoreCircle.classList.add('pre');
    document.getElementById('score-title').textContent = '先記下這個分數！';
    document.getElementById('score-desc').textContent = '上課結束後再來測一次「上課後測驗」，看看你的思維改變了多少 🌱';
  } else {
    // 後測：顯示成績等級與逐題回顧
    preNote.classList.add('hidden');
    reviewWrap.classList.remove('hidden');
    scoreCircle.classList.remove('pre');

    let title, desc;
    const pct = score / questions.length;
    if (pct >= 0.9) {
      title = '優勢觀點達人！';
      desc = '你已經非常自然地用優勢視角看待社區。把這個思維帶回去，讓更多夥伴一起感受！';
    } else if (pct >= 0.7) {
      title = '優勢思維開花中 🌱';
      desc = '你對優勢觀點有不錯的掌握！繼續練習換句話說，遇到社區困境時先問「我們有什麼」而不是「我們缺什麼」。';
    } else if (pct >= 0.5) {
      title = '思維翻轉進行中';
      desc = '問題導向的習慣很自然，這是長期訓練的結果。慢慢練習從資源與可能性出發，會愈來愈有感！';
    } else {
      title = '重新認識優勢觀點';
      desc = '沒關係，這正是今天課程的起點！回顧每題的說明，會幫助你建立新的思維框架。';
    }
    document.getElementById('score-title').textContent = title;
    document.getElementById('score-desc').textContent = desc;

    const list = document.getElementById('review-list');
    list.innerHTML = questions.map((q, i) => {
      const ok = answered[i] === q.ans;
      return `<div class="review-item ${ok?'ok':'fail'}">
        <div class="review-num">第 ${i+1} 題・${q.badge}</div>
        <div class="review-q">${q.q}</div>
        <span class="review-tag ${ok?'ok':'fail'}">${ok ? '✓ 答對' : '✗ 再想想'}</span>
      </div>`;
    }).join('');
  }
}

function goHome() {
  document.getElementById('score-screen').classList.remove('show');
  document.getElementById('start-screen').classList.remove('hidden');
}
</script>

</html>
